name: Build and test
on:
  push:
    branches: [main, codex/milestone-1-oauth]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet restore RunLeague.slnx
      - run: dotnet test RunLeague.slnx --no-restore --configuration Release
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/RunLeague.Api
      - run: npm install --ignore-scripts
        working-directory: src/runleague-web
      - run: npm run build
        working-directory: src/runleague-web
